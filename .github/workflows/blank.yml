name: CI/CD Pipeline - PilarBus

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Integración Continua (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Ejecutar pruebas unitarias e integración
        run: ./mvnw clean test

  deploy-to-cloud:
    name: Despliegue Continuo (CD)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Autenticar en el servidor de la nube / Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Construir y etiquetar imagen Docker
        run: |
          docker build -t tu-usuario/pilarbus-backend:${{ github.sha }} .
          docker tag tu-usuario/pilarbus-backend:${{ github.sha }} tu-usuario/pilarbus-backend:latest

      - name: Publicar imagen en el registro
        run: |
          docker push tu-usuario/pilarbus-backend:${{ github.sha }}
          docker push tu-usuario/pilarbus-backend:latest

      - name: Despliegue sin interrupciones (Zero-Downtime) en servidor remoto
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull tu-usuario/pilarbus-backend:latest
            # Actualización escalonada del contenedor backend sin cortar el tráfico activo
            docker stop pilarbus-app || true
            docker rm pilarbus-app || true
            docker run -d --name pilarbus-app -p 8080:8080 --restart always tu-usuario/pilarbus-backend:latest
